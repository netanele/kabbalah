<!doctype html>
<!--
  add-content skeleton. Copy to <workspace>/build/skeleton.html and fill the {{PLACEHOLDERS}} before assemble.py runs:
    {{TITLE}}         the <title>; usually project.json "title".
    {{DESCRIPTION}}   one-sentence meta description of the page, Hebrew.
    {{KICKER}}        hero kicker, 3-5 words separated by " · " (topics of the page).
    {{H1}}            hero title (the series / book name).
    {{SUB}}           hero subtitle (teacher or author, e.g. "סדרת שיעורי הרב …" or "ספרו של …").
    {{LEAD}}          hero paragraph: what the page holds, one or two sentences, with the unit count written in words.
    {{DATES}}         hero small line: "נאסף ונכתב DD.MM.YYYY · N <unit_label>ים · כ־H שעות · הדף מתעד את דברי … ואינו ממליץ לבצע דבר".
    {{NAV_UNITS}}     one nav pill per unit, each on its own line:
                        <a class="l" href="#<section_prefix>-N"><span class="lw"><unit_label> </span>N</a>
    {{INL_LABEL}}     the label before the per-unit chip list, by unit_label: "בשיעור הזה:" / "בפרק הזה:" / "בסרטון הזה:".
    {{UNIT_SECTIONS}} one placeholder comment per unit, in page order, each on its own line, blank line between:
                        [[ @@SECTION:<section_prefix>-N @@ ]] (written as an HTML comment in the real file)
    {{FOOTER}}        footer sentence: date, what the page documents (teacher, series, years), the no-recommendation clause,
                      the transcript credit for video units ("התמלולים אוטומטיים (ivrit.ai Whisper) ויש בהם שגיאות"),
                      and "מקורות: תנ"ך, חז"ל, זוהר, פוסקים, מקובלים ומחקר יהודי בלבד".
  Fixed section placeholders (summary, who, before, series, techniques, principles, books, more, research, transcripts) stay
  as they are; assemble.py fills each from build/parts/NN-<name>.html and leaves a "missing" comment when a part is absent.
  The nav labels for those sections may be edited (e.g. "מי הוא הרב" -> "מי הוא המחבר" for a text source); keep the
  .nf/.ns pairs (full label on wide screens, short label on narrow ones) and keep a.nav-home as the first item.
  Keep the whole CSS: it carries the phone nav as one scrolling row, .unc for "[?]" markers, the lw/nf/ns spans and the
  scroll-padding that keeps anchors below the sticky nav. Keep both script tags (js/read-aloud.js, js/find.js).
  Never write the four-letter Name anywhere in this file.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ---- base: identical to yosef-shani-aliyat-neshama.html ---- */
:root{color-scheme:light;--bg:#f4f0e6;--paper:#fffdf8;--ink:#26221c;--muted:#6f665a;--gold:#9c7a33;--gold2:#c9a75a;--line:#dcd2c0;--dark:#26221c;--warn:#9b5f58;--ok:#5f7a4a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{margin:0;background:var(--bg);direction:rtl;color:var(--ink);font-family:"Heebo","Noto Sans Hebrew",Arial,sans-serif;line-height:1.8;font-size:16.5px}
h1,h2,h3,h4,.serif{font-family:"Frank Ruhl Libre","David Libre","Times New Roman",serif}
a{color:#6d511d}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
header.hero{background:radial-gradient(1200px 500px at 80% -10%,#5a4a33 0%,#2b2620 55%,#1e1b17 100%);color:#f4ecdc;padding:60px 22px 50px;text-align:center}
.hero .emblem{width:70px;height:70px;color:var(--gold2);display:block;margin:0 auto 10px}
.hero .kicker{color:var(--gold2);letter-spacing:.14em;font-size:.85rem;font-weight:500}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);margin:8px 0 14px;line-height:1.15;font-weight:900}
.hero .sub{display:block;color:var(--gold2);font-family:"Frank Ruhl Libre",serif;font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:500;margin:-6px 0 16px}
.hero p{max-width:860px;margin:0 auto;color:#e6dcc8;font-size:1.12rem}
.hero .dates{margin-top:16px;color:var(--gold2);font-size:.95rem}
nav.top{position:sticky;top:0;z-index:20;background:#fffdf8f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
nav.top a{color:#5a4423;text-decoration:none;font-size:.84rem;padding:4px 9px;border-radius:999px;border:1px solid transparent}
nav.top a:hover{border-color:var(--line);background:#f3ecdf}
nav.top a.nav-home{color:var(--gold);font-weight:700}
nav.top .ns{display:none}
nav.top a.l{background:#f3ecdf;border-color:#e8dfcc;padding:4px 8px}
.container{max-width:1100px;margin:auto;padding:26px 18px 60px}
section{margin-top:46px}
section>h2{font-size:2rem;border-bottom:2px solid var(--gold2);padding-bottom:8px;margin:0 0 6px;line-height:1.3}
.lead,section>.lead{color:var(--muted);margin:0 0 18px;font-size:1.05rem}
h3{font-size:1.35rem;margin:26px 0 8px;color:#4b3b22}
h4{font-size:1.05rem;margin:14px 0 4px;color:#8a6a2a}
p{margin:0 0 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px;box-shadow:0 3px 12px #3a2c100d}
.card h3{margin-top:0}
.steps{counter-reset:step;list-style:none;margin:0;padding:0}
.steps>li{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 64px 14px 18px;margin:0 0 12px;box-shadow:0 3px 12px #3a2c100d}
.steps>li::before{counter-increment:step;content:counter(step);position:absolute;right:16px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--dark);color:var(--gold2);font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:1.1rem;display:grid;place-items:center}
.steps>li h4{margin:0 0 6px;font-size:1.12rem;color:#3a2e1d}
.steps>li p{margin:0 0 6px}
.srcs{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.srcs::before{content:"מקור:";color:var(--muted);font-size:.85rem;align-self:center}
a.src{display:inline-block;background:#efe7d6;color:#4b3b22;text-decoration:none;font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid #e3d8c2;white-space:nowrap}
a.src:hover{background:#e6dcc5}
.q{border-right:4px solid var(--gold2);background:#faf6ec;padding:10px 16px;margin:10px 0 12px;border-radius:0 10px 10px 0;font-family:"Frank Ruhl Libre",serif;font-size:1.05rem}
.q .who{display:block;color:var(--muted);font-family:"Heebo",sans-serif;font-size:.85rem;margin-top:4px}
.good{border-right:4px solid var(--ok);background:#eef3e7;padding:10px 16px;margin:10px 0 14px;border-radius:0 10px 10px 0}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.95rem;margin:8px 0 16px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:right}
th{background:#efe7d6;color:#4b3b22;font-weight:700}
tr:last-child td{border-bottom:0}
ul.plain{margin:0 0 12px;padding-right:20px}
ul.plain li{margin:0 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tag{display:inline-block;background:#efe7d6;padding:1px 10px;border-radius:999px;font-size:.78rem;color:#4b3b22;margin-left:4px;white-space:nowrap}
.tag.r{background:#f3e0dd;color:#6e3b36}
.tag.g{background:#e6ecd9;color:#3a4d2a}
details.tr{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 18px;margin:0 0 12px}
details.tr summary{cursor:pointer;font-size:1.1rem;font-weight:700;color:#3a2e1d}
details.tr summary .n{color:var(--muted);font-weight:400;font-size:.85rem;margin-right:8px}
details.tr .lead{font-size:.9rem;margin:6px 0 8px}
.trbody{max-height:520px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;font-size:.95rem}
.trbody p{margin:0 0 4px}
a.ts{color:var(--gold);text-decoration:none;font-size:.78rem;font-family:monospace;background:#f3ecdf;padding:0 6px;border-radius:6px}
footer{margin-top:50px;color:var(--muted);font-size:.9rem;text-align:center;border-top:1px solid var(--line);padding-top:18px}
bdi,.ltr{direction:ltr;unicode-bidi:isolate}

/* ---- extensions for this page ---- */
.hero .emblem{width:72px;height:72px}
section>h2 .ln{display:inline-block;vertical-align:middle;background:var(--dark);color:var(--gold2);font-family:"Heebo",sans-serif;font-size:.9rem;font-weight:500;letter-spacing:.04em;padding:2px 12px;border-radius:999px;margin-left:10px;line-height:1.7}
.meta{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;color:var(--muted);font-size:.9rem;margin:-8px 0 16px}
.meta span+span::before{content:"·";margin:0 8px;color:#b9ad97}
.meta a.yt{margin-right:12px;background:var(--dark);color:var(--gold2);text-decoration:none;padding:3px 12px;border-radius:999px;font-size:.85rem;white-space:nowrap}
.meta a.yt:hover{background:#3a3128}
.inl{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 16px;padding:0}
.inl::before{content:"{{INL_LABEL}}";color:var(--muted);font-size:.85rem;align-self:center;margin-left:4px}
.inl a{display:inline-block;background:var(--paper);border:1px solid var(--line);color:#4b3b22;text-decoration:none;font-size:.85rem;padding:3px 12px;border-radius:999px}
.inl a:hover{background:#f3ecdf}
.card.tech{border-top:3px solid var(--gold2);padding-top:16px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:-6px 0 12px}
.tags .tag{margin:0}
.tag.d{background:var(--dark);color:var(--gold2)}
dl.fields{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin:0 0 14px;background:#faf6ec;border:1px solid #efe6d2;border-radius:10px;padding:10px 14px;font-size:.95rem}
dl.fields dt{color:var(--gold);font-weight:700;margin:0}
dl.fields dd{margin:0}
.card .steps>li{background:#fbf8f1;border-color:#e8dfcc;box-shadow:none;padding:14px 58px 12px 16px}
.card .steps>li::before{width:30px;height:30px;right:14px;top:13px;font-size:1rem}
.names{background:#faf6ec;border:1px dashed var(--gold2);border-radius:10px;padding:10px 16px;margin:10px 0 14px;font-family:"Frank Ruhl Libre","David Libre",serif;font-size:1.15rem;line-height:2;overflow-wrap:anywhere}
.names p{margin:0}
.names .lbl{display:block;font-family:"Heebo",sans-serif;font-size:.8rem;color:var(--muted);line-height:1.5;margin-bottom:2px}
.names .lbl:not(:first-child){margin-top:8px}
.names bdi{letter-spacing:.08em}
.warn{border-right:4px solid var(--warn);background:#f8efed;padding:10px 16px;margin:10px 0 14px;border-radius:0 10px 10px 0}
.note{border-right:4px solid var(--gold2);background:#faf6ec;padding:10px 16px;margin:10px 0 14px;border-radius:0 10px 10px 0}
.warn p:last-child,.note p:last-child,.good p:last-child{margin-bottom:0}
.doubt{font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 14px;margin:10px 0 14px;background:#f9f6ef}
.doubt p{margin:0 0 4px}
details.qa{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 16px;margin:0 0 8px}
details.qa summary{cursor:pointer;font-weight:700;color:#3a2e1d}
details.qa summary::marker{color:var(--gold)}
details.qa .a{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
details.qa .a p:last-child{margin-bottom:0}
ul.stories{list-style:none;margin:0 0 14px;padding:0}
ul.stories>li{background:var(--paper);border:1px solid var(--line);border-right:4px solid var(--gold2);border-radius:0 10px 10px 0;padding:10px 16px;margin:0 0 10px}
ul.stories>li b{color:#4b3b22}
ul.stories>li p:last-child{margin-bottom:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:0 0 14px}
.card.ls{margin:0;display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.card.ls .ln{align-self:flex-start;background:var(--dark);color:var(--gold2);font-size:.82rem;padding:1px 10px;border-radius:999px}
.card.ls h3{font-size:1.15rem;margin:0;line-height:1.35}
.card.ls .d{color:var(--muted);font-size:.86rem}
.card.ls p{margin:0;font-size:.95rem;flex:1}
.card.ls a.go{align-self:flex-start;background:#efe7d6;color:#4b3b22;text-decoration:none;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1px solid #e3d8c2}
.card.ls a.go:hover{background:#e6dcc5}
.tw{overflow-x:auto;margin:8px 0 16px;-webkit-overflow-scrolling:touch}
.tw table{margin:0;min-width:560px}
table.idx td:first-child{font-weight:700}
td .srcs{margin:0}
td .srcs::before{content:none}
.container a:not(.src):not(.ts){overflow-wrap:anywhere}
a.totop{position:fixed;z-index:15;inset-inline-end:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:40px;height:40px;border-radius:50%;background:var(--dark);color:var(--gold2);display:grid;place-items:center;text-decoration:none;font-size:1.3rem;line-height:1;box-shadow:0 3px 12px #0003;opacity:.75}
a.totop:hover{opacity:1}
body:has(.ra-player:not([hidden])) a.totop{display:none}
.unc{font-size:.72em;color:var(--muted);position:relative;top:-.3em;margin:0 1px;white-space:nowrap}

/* sticky-nav offset = nav height + ~9px (Heebo loaded, find.js button present, 22 links):
   >=1024px full labels, 2 rows (83px) · 641–1023px short labels + lesson numbers, 2 rows (83px)
   <=640px one horizontally scrollable row (~40px). */
@media(max-width:1023px){
  nav.top .lw,nav.top .nf{display:none}
  nav.top .ns{display:inline}
  nav.top a{padding:4px 8px}
}
@media(max-width:640px){
  .steps>li{padding-right:56px}.hero{padding:44px 16px 36px}
  .container{padding:20px 16px 60px}
  section>h2{font-size:1.6rem}
  section>h2 .ln{display:block;width:max-content;margin:0 0 6px}
  html{scroll-padding-top:52px}
  nav.top{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:5px 8px;gap:4px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  nav.top::-webkit-scrollbar{display:none}
  nav.top>*{flex:none}
  nav.top a{font-size:.8rem;padding:3px 10px;white-space:nowrap}
  dl.fields{grid-template-columns:1fr;gap:0}
  dl.fields dt{margin-top:6px}
  dl.fields dt:first-child{margin-top:0}
  .card{padding:14px 14px}
  .card .steps>li{padding:12px 48px 10px 12px}
  .card .steps>li::before{width:26px;height:26px;right:11px;top:12px;font-size:.9rem}
  th,td{padding:7px 8px;font-size:.9rem}
  td a.src,th a.src{white-space:normal}
  .meta{display:block}
  .meta a.yt{display:table;margin:8px 0 0}
}
@media print{
  nav.top,a.totop{display:none}
  body{background:#fff}
  .card,.steps>li,details.qa,ul.stories>li{break-inside:avoid;box-shadow:none}
  .trbody{max-height:none}
  details.tr[open] .trbody{display:block}
  a.src,a.ts{border:1px solid #ccc;background:none}
}
</style>
</head>
<body id="top">

<header class="hero">
  <svg class="emblem" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5.5" y="5.6" width="13" height="12.8" fill="currentColor" fill-opacity=".14"/><path d="M5.5 5.6h13v12.8h-13z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><rect x="3.6" y="3.2" width="16.8" height="2.6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.6" y="18.2" width="16.8" height="2.6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M8.6 8.6h6.8v6.8h-6.8zM10.87 8.6v6.8M13.13 8.6v6.8M8.6 10.87h6.8M8.6 13.13h6.8" fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round" stroke-opacity=".85"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="9.73" cy="9.73" r=".6" fill="currentColor" fill-opacity=".7"/><circle cx="14.27" cy="14.27" r=".6" fill="currentColor" fill-opacity=".7"/></svg>
  <div class="kicker">{{KICKER}}</div>
  <h1>{{H1}}</h1>
  <span class="sub">{{SUB}}</span>
  <p>{{LEAD}}</p>
  <div class="dates">{{DATES}}</div>
</header>

<nav class="top" aria-label="ניווט">
  <a class="nav-home" href="index.html">ספריית הקבלה</a>
  <a href="#summary">תקציר</a>
  <a href="#who"><span class="nf">מי הוא הרב</span><span class="ns">הרב</span></a>
  <a href="#before"><span class="nf">לפני שמתחילים</span><span class="ns">לפני</span></a>
  <a href="#series"><span class="nf">מפת הסדרה</span><span class="ns">מפה</span></a>
  <a href="#techniques"><span class="nf">כל השיטות</span><span class="ns">שיטות</span></a>
{{NAV_UNITS}}
  <a href="#principles"><span class="nf">עקרונות וכללים</span><span class="ns">עקרונות</span></a>
  <a href="#books"><span class="nf">ספרים וחכמים</span><span class="ns">ספרים</span></a>
  <a href="#more"><span class="nf">המשך הסדרה</span><span class="ns">המשך</span></a>
  <a href="#research"><span class="nf">רקע ומקורות</span><span class="ns">מקורות</span></a>
  <a href="#transcripts">תמלולים</a>
</nav>

<main class="container">

<footer>
  {{FOOTER}}
</footer>

</body>
</html>
