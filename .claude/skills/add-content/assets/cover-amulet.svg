<?xml version="1.0" encoding="UTF-8"?>
<!-- add-content example cover (index.html, article.book > a.cover). Motif: an amulet scroll (two rolled ends) with a 3x3
     square on the parchment and a few cast lots (dots). Gold-on-dark comes from index.html's rule
     .cover svg{width:96px;height:96px;color:var(--gold2)}; a cover gets its own class (here "amulet") so index.html can
     size it, e.g. .cover svg.amulet{width:104px;height:104px}. Covers are pasted INLINE into index.html (drop the xml
     declaration and the xmlns), not linked as files. Draw a new motif for a new page; keep currentColor, no text, no raster. -->
<svg xmlns="http://www.w3.org/2000/svg" class="amulet" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect x="22" y="22" width="56" height="56" fill="currentColor" fill-opacity=".12"/><path d="M22 22h56v56H22z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><rect x="14" y="12" width="72" height="11" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="14" y="77" width="72" height="11" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M19.5 17.5h3M77.5 17.5h3M19.5 82.5h3M77.5 82.5h3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".5"/><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".85"><path d="M35 35h30v30H35z"/><path d="M45 35v30M55 35v30M35 45h30M35 55h30"/></g><g fill="currentColor"><circle cx="50" cy="50" r="2.6"/><circle cx="40" cy="40" r="1.9" fill-opacity=".75"/><circle cx="60" cy="60" r="1.9" fill-opacity=".75"/><circle cx="60" cy="40" r="1.4" fill-opacity=".5"/><circle cx="40" cy="60" r="1.4" fill-opacity=".5"/></g><g fill="currentColor" fill-opacity=".45"><circle cx="29" cy="30" r="1.2"/><circle cx="71" cy="29" r="1.2"/><circle cx="30" cy="70" r="1.2"/><circle cx="70" cy="71" r="1.2"/></g></svg>
